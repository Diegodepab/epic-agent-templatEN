name: Template Integrity CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python3 -m pip install --quiet pillow numpy pyyaml

      - name: Audit skill catalog strict standards
        run: python3 _catalog/skills/00-core/skill-authoring-and-updater/scripts/audit_skill.py _catalog/skills --strict --verify-help

      - name: Audit documentation integrity
        run: python3 _catalog/skills/00-core/architecture-knowledge-and-docs-sync/scripts/audit_docs_integrity.py --root .

      - name: Verify GitHub Actions SHA pinning
        run: bash _catalog/skills/github/git-commit-and-pr-gate/scripts/verify-action-pins.sh .

      - name: Run template bootstrap & stack end-to-end tests
        run: python3 tests/test_init_project.py

      - name: Run functional skill evaluations suite
        run: python3 evals/run_evals.py
