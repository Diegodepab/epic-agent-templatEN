name: Godot C# CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Static Godot & C# audits
        run: |
          python3 .agents/skills/godot-architecture-and-static-audit/scripts/check_csharp_godot_architecture.py --root .
          python3 .agents/skills/godot-scene-and-input-audit/scripts/audit_scene_and_input.py --root .

      - name: Run C# Domain tests
        run: python3 .agents/skills/godot-headless-testing/scripts/run_godot_tests.py --root . --dotnet-only
